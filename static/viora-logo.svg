<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Viora</title>
  <desc id="desc">Viora's glowing blue and ember V with a music note and sparkling sound waves.</desc>
  <defs>
    <linearGradient id="night" x1="30" y1="20" x2="470" y2="500" gradientUnits="userSpaceOnUse"><stop stop-color="#101a3c"/><stop offset="1" stop-color="#070b17"/></linearGradient>
    <linearGradient id="blue" x1="90" y1="90" x2="285" y2="420" gradientUnits="userSpaceOnUse"><stop stop-color="#9beaff"/><stop offset=".35" stop-color="#37b9ff"/><stop offset="1" stop-color="#3047ff"/></linearGradient>
    <linearGradient id="ember" x1="252" y1="180" x2="424" y2="420" gradientUnits="userSpaceOnUse"><stop stop-color="#fff1a8"/><stop offset=".35" stop-color="#ff9b4a"/><stop offset=".72" stop-color="#ff4e58"/><stop offset="1" stop-color="#dc2d83"/></linearGradient>
